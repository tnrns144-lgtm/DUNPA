# 1시간마다 네오플 API에서 경매장 시세·명성 랭킹·아바타 마켓 데이터를 모아 data 폴더에 저장해요.
name: 데이터 수집

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      force_trends:
        description: '랭커 트렌드를 지금 바로 다시 모으기 (평소엔 하루 1번)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 데이터 수집
        env:
          NEOPLE_API_KEY: ${{ secrets.NEOPLE_API_KEY }}
          FORCE_TRENDS: ${{ github.event.inputs.force_trends == 'true' && '1' || '' }}
        run: node scripts/collect.mjs

      - name: 바뀐 데이터 저장
        run: |
          git config user.name "dunlab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data index.html sitemap.xml jobs.html reports.html
          if [ -d jobs ]; then git add jobs; fi
          if [ -d reports ]; then git add reports; fi
          if git diff --cached --quiet; then
            echo "바뀐 데이터 없음"
          else
            git commit -m "데이터 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi
