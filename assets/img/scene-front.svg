<stop offset="1" stop-color="#FFB45A" stop-opacity="0"/>
</radialGradient>
<linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#0D0A0F" stop-opacity="0"/>
<stop offset="1" stop-color="#0D0A0F" stop-opacity="1"/>
</linearGradient>
</defs>
<!-- 돌바닥 -->
